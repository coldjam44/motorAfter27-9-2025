# Apache Virtual Host للموقع
# ضع هذا في /etc/apache2/sites-available/motors.conf

<VirtualHost *:80>
    ServerName motors.azsystems.tech
    ServerAlias www.motors.azsystems.tech
    DocumentRoot /home/smallwombat98/htdocs/motors.azsystems.tech/public/public
    
    <Directory /home/smallwombat98/htdocs/motors.azsystems.tech/public/public>
        AllowOverride All
        Require all granted
    </Directory>
    
    # تسجيل الأخطاء
    ErrorLog ${APACHE_LOG_DIR}/motors_error.log
    CustomLog ${APACHE_LOG_DIR}/motors_access.log combined
    
    # إعدادات PHP
    php_admin_value max_execution_time 300
    php_admin_value memory_limit 512M
    php_admin_value upload_max_filesize 100M
    php_admin_value post_max_size 100M
</VirtualHost>

# للتفعيل:
# sudo a2ensite motors.conf
# sudo systemctl reload apache2